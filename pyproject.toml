[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "barred-muse"
version = "0.1.0"
description = "BARRED: Evidence-Gated Security Fix Review with Meta Muse-Glimmer-30B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.5,<0.4.0",
    "a2a-sdk[http-server]>=0.3.5,<0.4.0",
    "google-adk>=2.3.0,<2.4.0",
    "google-genai>=1.39.0",
    "pydantic>=2.11.9",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.35.0",
    "litellm>=1.84.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "requests>=2.33.0",
    "tree-sitter>=0.26.0,<0.27.0",
    "tree-sitter-c>=0.24.2,<0.25.0",
    "numpy>=2.4.6",
]

[project.scripts]
agentbeats-run = "agentbeats.run_scenario:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.18.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentbeats"]
